<div class="card">
  <div class="card-header">
    <div class="d-flex justify-content-between align-items-center">
      <div class="p-2">
        <h5 class="mb-0 fw-bold">Shipping Addresses</h5>
      </div>
      <div class="d-flex align-items-center p-2">
        <button
          type="button"
          class="btn btn-success"
          data-mdb-ripple-init
          data-mdb-modal-init
          data-mdb-target="#createAddressModal"
        >
          Add new address
        </button>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="accordion accordion-flush" id="address-accordion">
      <div class="accordion-item" th:each="a, orderStat: ${addresses}">
        <h2
          class="accordion-header"
          th:id="'flush-heading-' + ${orderStat.index}"
        >
          <div class="d-flex justify-content-between align-items-start w-100">
            <button
              data-mdb-collapse-init
              class="accordion-button item-accordion-button collapsed flex-grow-1 text-start"
              type="button"
              th:data-mdb-target="'#flush-collapse-' + ${orderStat.index}"
              aria-expanded="false"
              th:aria-controls="'flush-collapse-' + ${orderStat.index}"
            >
              <i class="fas fa-chevron-right me-3 order-chevron text-muted"></i>
              <div class="ms-3">
                <p class="mb-1">
                  <span class="fw-bold me-3" th:text="${a.aliasName}"
                    >Alias name</span
                  >
                  <span
                    class="badge rounded-pill badge-info"
                    th:if="${a.isDefault}"
                    >Default address</span
                  >
                </p>
                <p class="text-muted mb-0" th:text="${a.fullAddress}">
                  Full address
                </p>
              </div>
            </button>

            <div class="d-flex my-3 ms-9">
              <button
                class="btn btn-link me-1"
                data-mdb-ripple-init
                data-mdb-ripple-color="dark"
                data-mdb-popover-init
                data-mdb-trigger="hover"
                data-mdb-content="Edit"
              >
                <i class="fa-solid fa-pencil"></i>
              </button>
              <form
                th:action="@{/account/profile/remove-address/{addressId}(addressId=${a.id})}"
                method="post"
                class="d-inline"
              >
                <button
                  class="btn btn-link me-1"
                  data-mdb-ripple-init
                  data-mdb-ripple-color="dark"
                  data-mdb-popover-init
                  data-mdb-trigger="hover"
                  data-mdb-content="Delete"
                >
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </form>
              <button
                class="btn btn-link me-1"
                data-mdb-ripple-init
                data-mdb-ripple-color="dark"
                data-mdb-popover-init
                data-mdb-trigger="hover"
                data-mdb-content="Set as defalt address"
              >
                <i class="fa-solid fa-check"></i>
              </button>
            </div>
          </div>
        </h2>

        <div
          th:id="'flush-collapse-' + ${orderStat.index}"
          class="accordion-collapse collapse"
          th:aria-labelledby="'flush-heading-' + ${orderStat.index}"
          data-mdb-parent="#address-accordion"
        >
          <div class="accordion-body">
            <div class="d-flex flex-column pb-5">
              <div>
                <span class="fw-bold text-gray-600">Street Address: </span>
                <span class="text-muted" th:text="${a.streetAddress}"
                  >Address</span
                >
              </div>
              <div>
                <span class="fw-bold text-gray-600">Ward: </span>
                <span class="text-muted" th:text="${a.ward}">Ward</span>
              </div>
              <div>
                <span class="fw-bold text-gray-600">District: </span>
                <span class="text-muted" th:text="${a.district}">District</span>
              </div>
              <div>
                <span class="fw-bold text-gray-600">Province: </span>
                <span class="text-muted" th:text="${a.province}">Province</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade"
  id="createAddressModal"
  tabindex="-1"
  aria-labelledby="createAddressModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog" aria-hidden="false">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="createAddressModalLabel">
          Add New Address
        </h5>
      </div>
      <div class="modal-body" th:object="${newAddress}">
        <form th:action="@{/account/profile/add-address}" method="post">
          <!-- Alias Name -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Alias Name</label>
            <div data-mdb-input-init class="form-outline">
              <input
                type="text"
                id="aliasName"
                class="form-control"
                th:field="*{aliasName}"
              />
              <label class="form-label" for="aliasName"
                >Enter alias name (optional)</label
              >
              <div class="text-danger" th:errors="*{aliasName}"></div>
            </div>
          </div>

          <!-- Street Address -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Street Address</label>
            <div data-mdb-input-init class="form-outline">
              <input
                type="text"
                id="streetAddress"
                class="form-control"
                th:field="*{streetAddress}"
              />
              <label class="form-label" for="streetAddress"
                >Enter street address</label
              >
              <div class="text-danger" th:errors="*{streetAddress}"></div>
            </div>
          </div>

          <!-- Province/City -->
          <div class="row mb-4">
            <label class="form-label fw-semibold">Province/City</label>
            <div class="col">
              <div data-mdb-input-init class="form-outline mb-3">
                <input type="text" id="searchInput" class="form-control" />
                <label class="form-label" for="searchInput"
                  >Enter search keyword</label
                >
              </div>
            </div>
            <div class="col">
              <select
                data-mdb-select-init
                class="select form-control"
                id="provinceSelect"
                th:field="*{province}"
              >
                <option value="" selected>Select Province/City</option>
              </select>
              <div class="text-danger" th:errors="*{province}"></div>
            </div>
          </div>

          <!-- District -->
          <div class="mb-4">
            <label class="form-label fw-semibold">District</label>
            <select
              data-mdb-select-init
              class="select form-control"
              id="districtSelect"
              th:field="*{district}"
              disabled
            >
              <option value="" selected>Select District</option>
            </select>
            <div class="text-danger" th:errors="*{district}"></div>
          </div>

          <!-- Ward/Commune -->
          <div class="mb-4">
            <label class="form-label fw-semibold">Ward/Commune</label>
            <select
              data-mdb-select-init
              class="select form-control"
              id="wardSelect"
              th:field="*{ward}"
              disabled
            >
              <option value="" selected>Select Ward/Commune</option>
            </select>
            <div class="text-danger" th:errors="*{ward}"></div>
          </div>

          <!-- Is Default Checkbox -->
          <div class="mb-4 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="isDefault"
              th:field="*{isDefault}"
            />
            <label class="form-check-label" for="isDefault"
              >Set as default address</label
            >
          </div>

          <!-- Buttons -->
          <div class="d-flex justify-content-end gap-2 mt-4">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-mdb-ripple-init
              data-mdb-dismiss="modal"
            >
              Cancel
            </button>
            <button type="submit" class="btn btn-primary" data-mdb-ripple-init>
              <i class="fas fa-save me-2"></i>Save
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
