<th:block th:fragment="viewStyles">
  <link href="/plugins/file-upload/file-upload.min.css" rel="stylesheet" />
</th:block>

<div th:fragment="content" class="container">
  <!-- Begin Breadcrumb -->
  <div class="col-md-6 col-12">
    <div
      th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb('Account')}"
    ></div>
  </div>
  <!-- End Breadcrumb -->

  <ul class="nav nav-tabs mb-3" id="ex1" role="tablist">
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link active"
        id="ex1-tab-1"
        href="#ex1-tabs-1"
        role="tab"
        aria-controls="ex1-tabs-1"
        aria-selected="true"
        >Details</a
      >
    </li>
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link"
        id="ex1-tab-2"
        href="#ex1-tabs-2"
        role="tab"
        aria-controls="ex1-tabs-2"
        aria-selected="false"
        >Shipping Address</a
      >
    </li>
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link"
        id="ex1-tab-3"
        href="#ex1-tabs-3"
        role="tab"
        aria-controls="ex1-tabs-3"
        aria-selected="false"
        >Payment Method</a
      >
    </li>
  </ul>

  <div class="tab-content" id="ex1-content">
    <div
      class="tab-pane fade show active"
      id="ex1-tabs-1"
      role="tabpanel"
      aria-labelledby="ex1-tab-1"
    >
      <div
        th:replace="~{client/account/profile/components/details/index}"
      ></div>
    </div>
    <div
      class="tab-pane fade"
      id="ex1-tabs-2"
      role="tabpanel"
      aria-labelledby="ex1-tab-2"
    >
      Tab 2 content
    </div>
    <div
      class="tab-pane fade"
      id="ex1-tabs-3"
      role="tabpanel"
      aria-labelledby="ex1-tab-3"
    >
      Tab 3 content
    </div>
  </div>
</div>

<th:block th:fragment="viewScripts">
  <script src="/plugins/file-upload/file-upload.min.js"></script>
  <script src="/plugins/inputmask/inputmask.min.js"></script>
</th:block>
