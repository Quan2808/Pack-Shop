<th:block th:fragment="viewStyles">
  <link href="/plugins/file-upload/file-upload.min.css" rel="stylesheet" />
  <style>
    .item-accordion-button::after {
      display: none;
    }
    .item-accordion-button.collapsed i.order-chevron {
      transform: rotate(0deg);
      transition: transform 0.2s ease-in-out;
    }
    .item-accordion-button:not(.collapsed) i.order-chevron {
      transform: rotate(90deg);
      transition: transform 0.2s ease-in-out;
    }
    .no-border-bottom {
      border-bottom: none !important;
    }
  </style>
</th:block>

<div th:fragment="content" class="container">
  <!-- Begin Breadcrumb -->
  <div class="col-md-6 col-12">
    <div
      th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb('Account')}"
    ></div>
  </div>
  <!-- End Breadcrumb -->

  <ul class="nav nav-tabs mb-3" id="account" role="tablist">
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link active"
        id="account-details"
        href="#account-details-tab"
        role="tab"
        aria-controls="account-details-tab"
        aria-selected="true"
        >Details</a
      >
    </li>
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link"
        id="account-address-tab"
        href="#account-address"
        role="tab"
        aria-controls="account-address"
        aria-selected="false"
        >Shipping Address</a
      >
    </li>
    <li class="nav-item" role="presentation">
      <a
        data-mdb-tab-init
        class="nav-link"
        id="account-payment-method-tab"
        href="#account-payment-method"
        role="tab"
        aria-controls="account-payment-method"
        aria-selected="false"
        >Payment Method</a
      >
    </li>
  </ul>

  <div class="tab-content my-4" id="account-content">
    <div
      class="tab-pane fade show active"
      id="account-details-tab"
      role="tabpanel"
      aria-labelledby="account-details"
    >
      <div
        th:replace="~{client/account/profile/components/details/index}"
      ></div>
    </div>
    <div
      class="tab-pane fade"
      id="account-address"
      role="tabpanel"
      aria-labelledby="account-address-tab"
    >
      <div
        th:replace="~{client/account/profile/components/address/index}"
      ></div>
      <div
        th:replace="~{client/account/profile/components/address/components/update}"
      ></div>
    </div>
    <div
      class="tab-pane fade"
      id="account-payment-method"
      role="tabpanel"
      aria-labelledby="account-payment-method-tab"
    >
      Tab 3 content
    </div>
  </div>
</div>

<th:block th:fragment="viewScripts">
  <script src="/plugins/file-upload/file-upload.min.js"></script>
  <script src="/js/address-loader.js"></script>
  <script src="/plugins/inputmask/inputmask.min.js"></script>
</th:block>
