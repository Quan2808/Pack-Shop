<th:block th:fragment="viewStyles"> </th:block>

<div th:fragment="content" class="container">
  <div
    th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item=Cart)}"
  ></div>

  <div class="row d-flex justify-content-center my-4">
    <div class="col-md-8">
      <div th:replace="~{client/cart/checkout/components/_products}"></div>
      <div th:replace="~{client/cart/checkout/components/_addresses}"></div>
    </div>

    <div class="col-md-4">
      <div class="card mb-4">
        <div class="card-header py-3">
          <h5 class="mb-0 fw-bold">Summary</h5>
        </div>
        <div class="card-body">
          <div>
            <label class="required form-label">Payment Method</label>

            <select
              data-mdb-select-init
              class="select form-control"
              id="payment-method"
            >
              <option value="Cash on Delivery" selected>
                Cash on Delivery
              </option>
            </select>
          </div>

          <hr />

          <div
            th:each="item: ${cart.cartItems}"
            class="d-flex justify-content-between align-items-center border-0 px-0 mb-3 text-muted"
          >
            <div>
              <strong th:text="${item.product.name}">Product Name</strong>
            </div>
            <span>
              <strong
                th:text="${#numbers.formatDecimal(item.product.price * item.quantity, 0, 'COMMA', 0, 'POINT')}"
                >100,000</strong
              >
              <i class="fa-solid fa-dong-sign"></i>
            </span>
          </div>

          <hr class="hr hr-blurry" />

          <div
            class="d-flex justify-content-between align-items-center border-0 px-0 mb-3"
          >
            <div>
              <strong>Total amount</strong>
            </div>
            <span>
              <strong
                th:text="${#numbers.formatInteger(#aggregates.sum(cart.cartItems.![product.price * quantity]), 0, 'COMMA')}"
                >100,000</strong
              >
              <i class="fa-solid fa-dong-sign"></i>
            </span>
          </div>
          <form id="orderForm" th:action="@{/order/create}" method="post">
            <input type="hidden" name="addressId" id="selectedAddressId" />
            <button
              data-mdb-ripple-init
              type="submit"
              class="btn btn-primary btn-block"
            >
              Order
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<th:block th:fragment="viewScripts">
  <script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
      // Get all radio buttons
      const addressRadios = document.querySelectorAll(
        'input[name="Address-Check-Out"]'
      );
      const selectedAddressInput = document.getElementById("selectedAddressId");

      // Set the default selected address (if any) on page load
      const defaultAddress = document.querySelector(
        'input[name="Address-Check-Out"]:checked'
      );
      if (defaultAddress) {
        selectedAddressInput.value = defaultAddress.id;
      }

      // Add event listener to update hidden input when a radio button is selected
      addressRadios.forEach((radio) => {
        radio.addEventListener("change", function () {
          if (this.checked) {
            selectedAddressInput.value = this.id; // Set the addressId to the hidden input
          }
        });
      });

      // Optional: Format prices to use dots instead of commas
      document.querySelectorAll("strong").forEach((el) => {
        el.textContent = el.textContent.replace(/,/g, ".");
      });
    });
  </script>
</th:block>
