<th:block th:fragment="viewStyles"> </th:block>

<div th:fragment="content" class="container">
  <!-- Begin Breadcrumb -->
  <div
    th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item='Cart')}"
  ></div>
  <!-- End Breadcrumb -->

  <div th:if="${cart.totalItems == 0}">
    <p>Your cart is empty.</p>
  </div>

  <div class="row d-flex justify-content-center my-4">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-header py-3">
          <h5
            class="mb-0 fw-bold"
            th:text="'Cart - ' + ${cart.totalItems} + ' items'"
          >
            Cart - 0 items
          </h5>
        </div>
        <div class="card-body">
          <!-- Single item -->
          <div th:each="item, iterStat : ${cart.cartItems}">
            <div class="row">
              <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                <!-- Image -->
                <div
                  class="bg-image hover-overlay hover-zoom ripple rounded"
                  data-mdb-ripple-color="light"
                >
                  <img
                    th:src="${item.product.thumbnail}"
                    class="w-100"
                    th:alt="${item.product.name}"
                  />
                  <a th:href="@{/products/{id}(id=${item.product.id})}">
                    <div
                      class="mask"
                      style="background-color: rgba(251, 251, 251, 0.2)"
                    ></div>
                  </a>
                </div>
                <!-- Image -->
              </div>

              <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                <!-- Data -->
                <p>
                  <strong th:text="${item.product.name}">Product Name</strong>
                </p>
                <!-- Có thể thêm thông tin như Color, Size nếu DTO hỗ trợ -->
                <p
                  class="text-muted"
                  th:text="'Price: ' + ${item.product.price}"
                ></p>

                <form
                  th:action="@{/cart/remove/{itemId}(itemId=${item.id})}"
                  method="post"
                  class="d-inline"
                >
                  <button type="submit" class="btn btn-danger btn-sm">
                    Remove
                  </button>
                </form>
                <!-- Data -->
              </div>

              <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                <!-- Quantity -->
                <form
                  th:action="@{/cart/update/{itemId}(itemId=${item.id})}"
                  method="post"
                >
                  <div class="d-flex mb-4" style="max-width: 300px">
                    <button
                      data-mdb-button-init
                      data-mdb-ripple-init
                      class="btn btn-primary px-3 me-2"
                      onclick="this.parentNode.querySelector('input[type=number]').stepDown()"
                    >
                      <i class="fas fa-minus"></i>
                    </button>

                    <div data-mdb-input-init class="form-outline">
                      <input
                        id="form1"
                        min="1"
                        name="quantity"
                        th:value="${item.quantity}"
                        type="number"
                        class="form-control"
                      />
                      <label class="form-label" for="form1">Quantity</label>
                    </div>

                    <button
                      data-mdb-button-init
                      data-mdb-ripple-init
                      class="btn btn-primary px-3 ms-2"
                      onclick="this.parentNode.querySelector('input[type=number]').stepUp()"
                    >
                      <i class="fas fa-plus"></i>
                    </button>
                  </div>
                  <button
                    type="submit"
                    data-mdb-button-init
                    data-mdb-ripple-init
                    class="btn btn-primary btn-sm w-100"
                  >
                    Update
                  </button>
                </form>
                <!-- Quantity -->

                <!-- Price -->
                <p class="text-start text-md-center">
                  <strong th:text="'Price: ' + ${item.product.price}"
                    >$0.00</strong
                  >
                </p>
                <!-- Price -->
              </div>
            </div>
            <hr class="my-4" th:unless="${iterStat.last}" />
          </div>
          <!-- Single item -->

          <!-- Giỏ hàng rỗng -->
          <div th:if="${cart.cartItems == null or cart.cartItems.isEmpty()}">
            <p class="text-center">Your cart is empty.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card mb-4">
        <div class="card-header py-3">
          <h5 class="mb-0 fw-bold">Summary</h5>
        </div>
        <div class="card-body">
          <div
            class="d-flex justify-content-between align-items-center border-0 px-0 mb-3"
          >
            <div>
              <strong>Total amount</strong>
              <strong><p class="mb-0">(including VAT)</p></strong>
            </div>
            <span
              ><strong
                th:text="${#aggregates.sum(cart.cartItems.![product.price * quantity])} + ' USD'"
                >$0.00</strong
              ></span
            >
          </div>
          <button
            type="button"
            data-mdb-button-init
            data-mdb-ripple-init
            class="btn btn-primary btn-lg btn-block"
          >
            Go to checkout
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<th:block th:fragment="viewScripts">
  <div th:replace="~{fragments\common\_toasts}"></div>
</th:block>
