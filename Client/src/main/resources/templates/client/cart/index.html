<th:block th:fragment="viewStyles"> </th:block>

<div th:fragment="content" class="container">
  <div
    th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item=null)}"
  ></div>

  <div class="row d-flex justify-content-center my-4">
    <div class="col-md-8">
      <div class="card mb-4">
        <div class="card-header py-3">
          <div class="d-flex justify-content-between align-items-center">
            <div class="p-2">
              <h5 class="mb-0 fw-bold">Cart</h5>
            </div>
            <div class="d-flex align-items-center">
              <div class="me-3">
                <button
                  type="button"
                  class="btn btn-success"
                  data-mdb-ripple-init
                  id="update-cart-btn"
                  disabled
                >
                  Update Cart
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div th:each="item, iterStat : ${cart.cartItems}">
            <div class="row">
              <div class="col-lg-3 col-md-12 mb-4 mb-lg-0">
                <div
                  class="bg-image hover-overlay hover-zoom ripple rounded"
                  data-mdb-ripple-color="light"
                >
                  <img
                    th:src="${item.product.thumbnail}"
                    class="w-100"
                    th:alt="${item.product.name}"
                  />
                  <a th:href="@{/products/{id}(id=${item.product.id})}">
                    <div
                      class="mask"
                      style="background-color: rgba(251, 251, 251, 0.2)"
                    ></div>
                  </a>
                </div>
              </div>

              <div class="col-lg-5 col-md-6 mb-4 mb-lg-0">
                <p>
                  <strong th:text="${item.product.name}">Product Name</strong>
                </p>
                <p
                  class="text-muted"
                  th:text="'Price: ' + ${item.product.price}"
                ></p>
                <form
                  th:action="@{/cart/remove/{itemId}(itemId=${item.id})}"
                  method="post"
                  class="d-inline"
                >
                  <button type="submit" class="btn btn-danger btn-sm">
                    Remove
                  </button>
                </form>
              </div>

              <div class="col-lg-4 col-md-6 mb-4 mb-lg-0">
                <form
                  th:action="@{/cart/items}"
                  method="post"
                  class="update-form"
                >
                  <input
                    type="hidden"
                    name="id"
                    th:value="${item.id}"
                    class="item-id"
                  />
                  <div class="d-flex mb-4" style="max-width: 300px">
                    <button
                      data-mdb-button-init
                      data-mdb-ripple-init
                      class="btn btn-primary px-3 me-2 btn-minus"
                      onclick="this.parentNode.querySelector('input[type=number]').stepDown()"
                      type="button"
                    >
                      <i class="fas fa-minus"></i>
                    </button>

                    <div data-mdb-input-init class="form-outline">
                      <input
                        min="1"
                        name="quantity"
                        th:value="${item.quantity}"
                        type="number"
                        class="form-control quantity-input"
                      />
                      <label class="form-label">Quantity</label>
                    </div>

                    <button
                      data-mdb-button-init
                      data-mdb-ripple-init
                      class="btn btn-primary px-3 ms-2 btn-plus"
                      onclick="this.parentNode.querySelector('input[type=number]').stepUp()"
                      type="button"
                    >
                      <i class="fas fa-plus"></i>
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <hr class="my-4" th:unless="${iterStat.last}" />
          </div>

          <div th:if="${cart.cartItems == null or cart.cartItems.isEmpty()}">
            <p class="text-center">Your cart is empty.</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card mb-4">
        <div class="card-header py-3">
          <h5 class="mb-0 fw-bold">Summary</h5>
        </div>
        <div class="card-body">
          <div
            class="d-flex justify-content-between align-items-center border-0 px-0 mb-3"
          >
            <div>
              <strong>Total amount</strong>
            </div>
            <span
              ><strong
                th:text="${#aggregates.sum(cart.cartItems.![product.price * quantity])}"
                >$0.00</strong
              >
              <i class="fa-solid fa-dong-sign"></i
            ></span>
          </div>
          <button
            type="button"
            data-mdb-button-init
            data-mdb-ripple-init
            class="btn btn-primary btn-lg btn-block"
          >
            Go to checkout
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<th:block th:fragment="viewScripts">
  <script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
      const updateCartBtn = document.getElementById("update-cart-btn");
      const updateForms = document.querySelectorAll(".update-form");
      const initialValues = new Map();

      updateForms.forEach((form) => {
        const input = form.querySelector(".quantity-input");
        const itemId = form.querySelector(".item-id").value;
        if (input && itemId) {
          initialValues.set(itemId, input.value);
        }
      });

      function toggleUpdateCartButton() {
        let hasChanges = false;
        updateForms.forEach((form) => {
          const input = form.querySelector(".quantity-input");
          const itemId = form.querySelector(".item-id").value;
          if (
            input &&
            itemId &&
            input.value !== initialValues.get(itemId) &&
            input.value >= 1
          ) {
            hasChanges = true;
          }
        });
        updateCartBtn.disabled = !hasChanges;
      }

      updateForms.forEach((form) => {
        const input = form.querySelector(".quantity-input");
        const minusButton = form.querySelector(".btn-minus");
        const plusButton = form.querySelector(".btn-plus");

        input.addEventListener("input", toggleUpdateCartButton);
        minusButton?.addEventListener("click", () =>
          setTimeout(toggleUpdateCartButton, 0)
        );
        plusButton?.addEventListener("click", () =>
          setTimeout(toggleUpdateCartButton, 0)
        );
      });

      updateCartBtn.addEventListener("click", function () {
        const changedItems = [];
        updateForms.forEach((form) => {
          const input = form.querySelector(".quantity-input");
          const itemId = form.querySelector(".item-id").value;
          if (
            input &&
            itemId &&
            input.value !== initialValues.get(itemId) &&
            input.value >= 1
          ) {
            changedItems.push({
              id: itemId,
              quantity: input.value,
            });
          }
        });

        if (changedItems.length > 0) {
          const multiUpdateForm = document.createElement("form");
          multiUpdateForm.method = "post";
          multiUpdateForm.action = "/cart/items";

          changedItems.forEach((item) => {
            const idInput = document.createElement("input");
            idInput.type = "hidden";
            idInput.name = "id";
            idInput.value = item.id;
            multiUpdateForm.appendChild(idInput);

            const quantityInput = document.createElement("input");
            quantityInput.type = "hidden";
            quantityInput.name = "quantity";
            quantityInput.value = item.quantity;
            multiUpdateForm.appendChild(quantityInput);
          });

          document.body.appendChild(multiUpdateForm);
          multiUpdateForm.submit();

          changedItems.forEach((item) => {
            initialValues.set(item.id, item.quantity);
          });
          toggleUpdateCartButton();
        }
      });
    });
  </script>
</th:block>
