<th:block th:fragment="viewStyles"> </th:block>

<div th:fragment="content" class="container">
  <div th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item=null)}"></div>

  <div class="container mt-5">
    <h1 class="mb-4">Your Orders</h1>
  
    <!-- Hiển thị thông báo thành công hoặc lỗi -->
    <div th:if="${successMessage}" class="alert alert-success" role="alert">
      <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
      <span th:text="${errorMessage}"></span>
    </div>
  
    <!-- Nút tạo đơn hàng -->
    <form th:action="@{/order/create}" method="post" class="mb-4">
      <button type="submit" class="btn btn-primary">Create New Order</button>
    </form>
  
    <!-- Danh sách đơn hàng -->
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Status</th>
          <th>Total Amount</th>
          <th>Items</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="order : ${orders}" th:object="${order}">
          <td th:text="*{id}"></td>
          <td th:text="*{status}"></td>
          <td th:text="*{totalAmount}"></td>
          <td>
            <ul>
              <li th:each="item : *{orderItems}" th:text="${item.productName} + ' (x' + ${item.quantity} + ')'"></li>
            </ul>
          </td>
          <td>
            <!-- Form cập nhật trạng thái -->
            <form th:action="@{/order/{id}/update-status(id=*{id})}" method="post" class="d-inline">
              <select name="newStatus" class="form-select d-inline w-auto">
                <option value="PENDING">Pending</option>
                <option value="SHIPPED">Shipped</option>
                <option value="DELIVERED">Delivered</option>
                <option value="CANCELLED">Cancelled</option>
              </select>
              <button type="submit" class="btn btn-sm btn-warning">Update</button>
            </form>
            <!-- Form hủy đơn hàng -->
            <!-- <form th:action="@{/order/{id}/cancel(id=*{id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-danger" th:disabled="*{status != 'PENDING'}">Cancel</button>
            </form> -->
            <form th:action="@{/order/{id}/cancel(id=*{id})}" method="post" class="d-inline">
              <button type="submit" class="btn btn-sm btn-danger">Cancel</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(orders)}">
          <td colspan="5" class="text-center">No orders found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
