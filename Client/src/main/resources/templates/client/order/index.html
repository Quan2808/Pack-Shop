<th:block th:fragment="viewStyles">
  <style>
    .order-accordion-button::after {
      display: none;
    }
    .order-accordion-button.collapsed i.order-chevron {
      transform: rotate(0deg);
      transition: transform 0.2s ease-in-out;
    }
    .order-accordion-button:not(.collapsed) i.order-chevron {
      transform: rotate(90deg);
      transition: transform 0.2s ease-in-out;
    }
    .no-border-bottom {
      border-bottom: none !important;
    }
  </style>
</th:block>

<div th:fragment="content" class="container">
  <div
    th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item=null)}"
  ></div>

  <div class="card">
    <div class="card-body">
      <div class="accordion accordion-flush" id="order-accordion">
        <div
          class="accordion-item"
          th:each="order, orderStat : ${orders}"
          th:object="${order}"
        >
          <h2
            class="accordion-header"
            th:id="'flush-heading-' + ${orderStat.index}"
          >
            <button
              data-mdb-collapse-init
              class="accordion-button order-accordion-button collapsed"
              type="button"
              th:data-mdb-target="'#flush-collapse-' + ${orderStat.index}"
              aria-expanded="false"
              th:aria-controls="'flush-collapse-' + ${orderStat.index}"
            >
              <i class="fas fa-chevron-right me-3 order-chevron text-muted"></i>
              <div class="ms-3">
                <p class="mb-1">
                  <span class="fw-bold me-3" th:text="'Order #' + ${order.id}"
                    >Order #123</span
                  >
                  <span
                    th:text="${order.status}"
                    th:class="${'badge ' + 
                (order.status == T(com.packshop.client.dto.shopping.order.OrderDTO.Status).DELIVERED ? 'bg-success' : 
                (order.status == T(com.packshop.client.dto.shopping.order.OrderDTO.Status).PENDING ? 'bg-warning' : 
                (order.status == T(com.packshop.client.dto.shopping.order.OrderDTO.Status).SHIPPED ? 'bg-primary' : 'bg-danger')))}"
                  >
                    STATUS
                  </span>
                </p>
                <p
                  class="text-muted mb-0"
                  th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}"
                >
                  01-01-2023 12:00
                </p>
              </div>
            </button>
          </h2>
          <div
            th:id="'flush-collapse-' + ${orderStat.index}"
            class="accordion-collapse collapse"
            th:aria-labelledby="'flush-heading-' + ${orderStat.index}"
            data-mdb-parent="#order-accordion"
          >
            <div class="accordion-body">
              <table class="table align-middle table-row-dashed fs-6 gy-5 mb-0">
                <thead>
                  <tr
                    class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0"
                  >
                    <th class="fw-bold min-w-175px">Product</th>
                    <th class="fw-bold min-w-70px text-end">Qty</th>
                    <th class="fw-bold min-w-100px text-end">Unit Price</th>
                    <th class="fw-bold min-w-100px text-end">Total</th>
                  </tr>
                </thead>
                <tbody class="fw-semibold text-gray-600">
                  <tr th:each="item : ${order.orderItems}">
                    <td>
                      <div class="d-flex align-items-center">
                        <img
                          th:src="${item.product.thumbnail}"
                          th:alt="${item.product.name}"
                          style="width: 45px; height: 45px"
                          class="img-fluid rounded"
                        />
                        <div class="ms-5">
                          <div
                            class="fs-7 text-muted"
                            th:text="${item.product.name}"
                          ></div>
                        </div>
                      </div>
                    </td>
                    <td
                      class="text-end text-muted"
                      th:text="${item.quantity}"
                    ></td>
                    <td
                      class="text-end text-muted"
                      th:text="${#numbers.formatInteger(item.unitPrice, 0, 'POINT')} + ' đ'"
                    ></td>
                    <td
                      class="text-end text-muted"
                      th:text="${#numbers.formatInteger(item.subtotal, 0, 'POINT')} + ' đ'"
                    ></td>
                  </tr>
                  <tr>
                    <td colspan="3" class="text-end no-border-bottom">
                      Subtotal
                    </td>
                    <td
                      class="fw-bolder text-end no-border-bottom"
                      th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT')} + ' đ'"
                    ></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div th:if="${#lists.isEmpty(orders)}">No orders found.</div>
    </div>
  </div>
</div>
