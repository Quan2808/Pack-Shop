<th:block th:fragment="viewStyles"> </th:block>

<div th:fragment="content" class="container">
  <div
    th:replace="~{fragments/client/components/_breadcrumb :: breadcrumb(item=null)}"
  ></div>

  <div class="card my-4">
    <div class="card-header">
      <div class="d-flex justify-content-between align-items-center">
        <div class="p-2">
          <h5 class="mb-0 fw-bold">Orders</h5>
        </div>
      </div>
    </div>
    <div class="card-body">
      <div class="accordion accordion-flush" id="order-accordion">
        <div
          class="accordion-item"
          th:each="order, stat : ${orders}"
          th:object="${order}"
        >
          <h2 class="accordion-header" th:id="'flush-heading-' + ${stat.index}">
            <button
              data-mdb-collapse-init
              class="accordion-button item-accordion-button collapsed"
              type="button"
              th:data-mdb-target="'#flush-collapse-' + ${stat.index}"
              aria-expanded="false"
              th:aria-controls="'flush-collapse-' + ${stat.index}"
            >
              <i class="fas fa-chevron-right me-3 order-chevron text-muted"></i>
              <div class="ms-3">
                <p class="mb-1">
                  <span class="fw-bold me-3" th:text="'Order #' + ${order.id}"
                    >Order #123</span
                  >
                  <span
                    th:text="${order.status}"
                    th:class="${'badge rounded-pill ' + 
    (order.status.name() == 'DELIVERED' ? 'badge-success' : 
    (order.status.name() == 'PENDING' ? 'badge-warning' : 
    (order.status.name() == 'SHIPPED' ? 'badge-primary' : 'badge-danger')))}"
                  >
                    STATUS
                  </span>
                </p>
                <p
                  class="text-muted mb-0"
                  th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm') : 'N/A'}"
                >
                  01-01-2023 12:00
                </p>
              </div>
            </button>
          </h2>
          <div
            th:id="'flush-collapse-' + ${stat.index}"
            class="accordion-collapse collapse"
            th:aria-labelledby="'flush-heading-' + ${stat.index}"
            data-mdb-parent="#order-accordion"
          >
            <div class="accordion-body">
              <table class="table align-middle table-row-dashed fs-6 gy-5 mb-0">
                <thead>
                  <tr
                    class="text-start text-gray-500 fw-bold fs-7 text-uppercase gs-0"
                  >
                    <th class="fw-bold min-w-175px">Product</th>
                    <th class="fw-bold min-w-70px text-end">Qty</th>
                    <th class="fw-bold min-w-100px text-end">Unit Price</th>
                    <th class="fw-bold min-w-100px text-end">Total</th>
                  </tr>
                </thead>
                <tbody
                  th:if="${order.orderItems != null and not #lists.isEmpty(order.orderItems)}"
                  class="fw-semibold text-gray-600"
                >
                  <tr th:each="item : ${order.orderItems}">
                    <td>
                      <div class="d-flex align-items-center">
                        <img
                          th:src="${item.product.thumbnail}"
                          th:alt="${item.product.name}"
                          style="width: 45px; height: 45px"
                          class="rounded-circle"
                        />
                        <p
                          class="fw-bold mb-1 ms-3"
                          th:text="${item.product.name}"
                        >
                          Product Name
                        </p>
                      </div>
                    </td>
                    <td
                      class="text-end text-muted"
                      th:text="${item.quantity}"
                    ></td>
                    <td
                      class="text-end text-muted"
                      th:text="${#numbers.formatInteger(item.unitPrice, 0, 'POINT') + 'đ'}"
                    ></td>
                    <td
                      class="text-end text-muted"
                      th:text="${#numbers.formatInteger(item.subtotal, 0, 'POINT') + 'đ'}"
                    ></td>
                  </tr>
                </tbody>
                <tbody
                  th:unless="${order.orderItems != null and not #lists.isEmpty(order.orderItems)}"
                >
                  <tr>
                    <td colspan="4">No items in this order.</td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr>
                    <td
                      class="text-end text-muted no-border-bottom"
                      th:text="${order.address}"
                    >
                      Shipping Address
                    </td>
                    <td colspan="2" class="text-end no-border-bottom">
                      Subtotal
                    </td>
                    <td
                      class="fw-bolder text-end no-border-bottom"
                      th:text="${#numbers.formatInteger(order.totalAmount, 0, 'POINT')}"
                    ></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div th:if="${#lists.isEmpty(orders)}">No orders found.</div>
    </div>
  </div>
</div>
